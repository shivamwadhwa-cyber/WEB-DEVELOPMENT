<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="task1_style.css">
</head>
<body>
    <div class="form-container">
        <h1>Student Registration Form</h1>
        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>

            <label>Gender:</label>
            <div class="inline">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <label>Hobbies:</label>
            <div class="inline">
                <label><input type="checkbox" name="hobby" value="Coding"> Coding</label>
                <label><input type="checkbox" name="hobby" value="Sports"> Sports</label>
                <label><input type="checkbox" name="hobby" value="Music"> Music</label>
                <label><input type="checkbox" name="hobby" value="Reading"> Reading</label>
            </div>

            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Tech</option>
                <option>MCA</option>
            </select>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city">

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
