<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Calculator</title>
<style>
body { font-family:Arial; background:#f1f4f8; padding:40px; }
.calculator { max-width:400px; margin:auto; background:white; padding:25px; border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.15); }
input { width:100%; padding:12px; margin:8px 0; box-sizing:border-box; }
button { width:48%; padding:11px; margin:4px 1%; border:0; border-radius:5px; cursor:pointer; }
#result { margin-top:20px; padding:12px; background:#eef3f8; font-weight:bold; }
</style>
</head>
<body>
<div class="calculator">
<h1>Simple Calculator</h1>
<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">

<button onclick="calculate('+')">Addition (+)</button>
<button onclick="calculate('-')">Subtraction (-)</button>
<button onclick="calculate('*')">Multiplication (*)</button>
<button onclick="calculate('/')">Division (/)</button>

<div id="result">Result: </div>
</div>

<script>
function calculate(operator) {
    const a = parseFloat(document.getElementById("num1").value);
    const b = parseFloat(document.getElementById("num2").value);
    const resultBox = document.getElementById("result");

    if (Number.isNaN(a) || Number.isNaN(b)) {
        resultBox.textContent = "Result: Please enter both numbers.";
        return;
    }

    let result;
    switch (operator) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/":
            if (b === 0) {
                resultBox.textContent = "Result: Cannot divide by zero.";
                return;
            }
            result = a / b;
            break;
    }
    resultBox.textContent = "Result: " + result;
}
</script>
</body>
</html>
