
<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Website</title>
    <style>
        body {
            font-family: Arial;
            background: #fff3e0;
            text-align: center;
        }

        header {
            background: darkred;
            color: white;
            padding: 20px;
        }

        .menu {
            background: white;
            margin: 15px auto;
            padding: 15px;
            width: 300px;
            border-radius: 10px;
        }

        button {
            background: darkred;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spice Garden Restaurant</h1>
        <p>Delicious Food, Great Taste</p>
    </header>

    <h2>Our Menu</h2>

    <div class="menu">
        <h3>Paneer Tikka</h3>
        <p>Price: ₹220</p>
    </div>

    <div class="menu">
        <h3>Veg Biryani</h3>
        <p>Price: ₹180</p>
    </div>

    <div class="menu">
        <h3>Masala Dosa</h3>
        <p>Price: ₹140</p>
    </div>

    <button onclick="special()">Today's Special</button>
    <p id="result"></p>

    <h3>Contact Us</h3>
    <p>Phone: 00000 00000</p>
    <p>Address: Main Market, Your City</p>

    <script>
        function special() {
            document.getElementById("result").innerHTML =
                "Today's Special: Paneer Tikka!";
        }
    </script>

</body>
</html>
